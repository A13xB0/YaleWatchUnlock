[versions]
agp = "9.4.1"
kotlin = "2.2.20"

compileSdk = "37"
# Pixel Watch 4 ships Wear OS 6 (API 36). API 33 is the floor for the
# BLUETOOTH_SCAN/CONNECT model plus the value-carrying GATT callbacks used here.
minSdk = "33"
targetSdk = "36"

coreKtx = "1.18.0"
lifecycle = "2.10.0"
activityCompose = "1.13.0"
# androidx.wear:wear drags in fragment 1.2.4, which breaks ActivityResult permission requests.
fragment = "1.7.1"
composeBom = "2026.06.01"
coroutines = "1.11.0"

wearComposeMaterial3 = "1.6.2"
wear = "1.4.0"
tiles = "1.6.2"
protolayout = "1.4.2"
concurrentFutures = "1.3.0"
guava = "33.7.1-android"
glanceWear = "1.0.0-alpha20"

junit = "4.13.2"
json = "20250517"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wearComposeMaterial3" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wearComposeMaterial3" }
wear-compose-navigation = { module = "androidx.wear.compose:compose-navigation", version.ref = "wearComposeMaterial3" }
wear = { module = "androidx.wear:wear", version.ref = "wear" }

wear-tiles = { module = "androidx.wear.tiles:tiles", version.ref = "tiles" }
wear-protolayout = { module = "androidx.wear.protolayout:protolayout", version.ref = "protolayout" }
androidx-concurrent-futures-ktx = { module = "androidx.concurrent:concurrent-futures-ktx", version.ref = "concurrentFutures" }
# Tiles expose ListenableFuture; real Guava avoids the empty listenablefuture stub.
guava = { module = "com.google.guava:guava", version.ref = "guava" }
# Wear OS widgets (Remote Compose based).
glance-wear = { module = "androidx.glance.wear:wear", version.ref = "glanceWear" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

junit = { module = "junit:junit", version.ref = "junit" }
# org.json is part of Android but stubbed in local unit tests; the real one parses the vectors.
json = { module = "org.json:json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
